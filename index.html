<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVerse - Streaming</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="style.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        #boot-screen {
            position: fixed; inset: 0; z-index: 99999;
            background: #0a0a0f;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 20px; transition: opacity 0.5s ease;
        }
        #boot-screen.fade-out { opacity: 0; pointer-events: none; }
        #boot-screen .logo-big { font-family: 'Orbitron', monospace; font-size: 48px; font-weight: 900; }
        #boot-screen .logo-big .accent { color: #00d4ff; text-shadow: 0 0 30px rgba(0,212,255,0.8); }
        #boot-screen .loader { width: 200px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
        #boot-screen .loader-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #00d4ff, #7b2fff); border-radius: 3px; animation: bootLoad 2s ease forwards; }
        #boot-screen .boot-text { color: #6b6b8d; font-size: 14px; font-family: 'Rajdhani', sans-serif; }
        @keyframes bootLoad { 0% { width: 0%; } 50% { width: 70%; } 100% { width: 100%; } }
        #boot-error { display: none; color: #ff2d95; margin-top: 10px; font-size: 13px; max-width: 400px; text-align: center; }
    </style>
</head>
<body>
    <div id="boot-screen">
        <div class="logo-big">CINE<span class="accent">VERSE</span></div>
        <div class="loader"><div class="loader-bar"></div></div>
        <div class="boot-text">Carregando plataforma...</div>
        <div id="boot-error"></div>
    </div>
    
    <nav class="navbar" style="display:none" id="mainNav">
        <div class="nav-container">
            <a href="#" class="logo" onclick="goHome()">
                <div class="logo-icon"><i class="fas fa-play"></i></div>
                <span class="logo-text">CINE<span class="accent">VERSE</span></span>
            </a>
            
            <div class="nav-center">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Buscar filmes, series, animes...">
                    <i class="fas fa-search search-icon"></i>
                    <div class="search-filters">
                        <button class="filter-btn active" data-filter="all">Todos</button>
                        <button class="filter-btn" data-filter="movie">Filmes</button>
                        <button class="filter-btn" data-filter="tv">Series</button>
                        <button class="filter-btn" data-filter="anime">Anime</button>
                    </div>
                </div>
            </div>
            
            <div class="nav-right">
                <div class="nav-links">
                    <a href="#" class="active" data-category="home"><i class="fas fa-home"></i><span>Inicio</span></a>
                    <a href="#" data-category="movie"><i class="fas fa-film"></i><span>Filmes</span></a>
                    <a href="#" data-category="tv"><i class="fas fa-tv"></i><span>Series</span></a>
                    <a href="#" data-category="anime"><i class="fas fa-dragon"></i><span>Anime</span></a>
                    <a href="#" data-category="live"><i class="fas fa-broadcast-tower"></i><span>TV Ao Vivo</span></a>
                    <a href="#" data-category="favorites"><i class="fas fa-heart"></i><span>Favoritos</span></a>
                </div>
                <div class="user-profile"><i class="fas fa-user-circle"></i></div>
            </div>
        </div>
    </nav>

    <main class="main-content" id="mainContent" style="display:none">
    </main>

    <div class="modal" id="movieModal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
            <div class="modal-hero" id="modalHero"></div>
            <div class="modal-body">
                <div class="modal-poster" id="modalPoster"></div>
                <div class="modal-info">
                    <h2 class="modal-title" id="modalTitle"></h2>
                    <div class="modal-meta">
                        <span class="meta-badge rating"><i class="fas fa-star"></i> <span id="modalRating"></span></span>
                        <span class="meta-badge"><i class="fas fa-calendar"></i> <span id="modalYear"></span></span>
                        <span class="meta-badge"><i class="fas fa-clock"></i> <span id="modalDuration"></span></span>
                        <span class="meta-badge genre" id="modalGenre"></span>
                    </div>
                    <p class="modal-desc" id="modalDesc"></p>
                    <div class="modal-tags" id="modalTags"></div>
                    <div class="modal-buttons">
                        <button class="btn-primary glow" id="modalPlay"><i class="fas fa-play"></i> ASSISTIR</button>
                        <button class="btn-secondary" id="modalFav"><i class="fas fa-heart"></i> FAVORITAR</button>
                    </div>
                    <div class="modal-seasons" id="modalSeasons" style="display:none;">
                        <h3>Temporadas</h3>
                        <div class="seasons-list" id="seasonsList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="player-overlay" id="playerOverlay">
        <div class="player-bg"></div>
        <div class="player-container">
            <div class="player-header">
                <button class="player-back" id="playerBack"><i class="fas fa-arrow-left"></i></button>
                <h3 class="player-title" id="playerTitle"></h3>
            </div>
            <div class="player-wrapper" id="playerWrapper"></div>
        </div>
    </div>

    <footer class="footer" id="mainFooter" style="display:none">
        <div class="footer-content">
            <div class="footer-logo">
                <span class="logo-text">CINE<span class="accent">VERSE</span></span>
                <p>Sua experiencia de streaming definitiva</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 CineVerse. Dados de TMDB. Conteudo de dominio publico.</p>
        </div>
    </footer>

    <script src="config.js?v=2"></script>
    <script src="tmdb.js?v=2"></script>
    <script src="player.js?v=2"></script>
    <script src="app.js?v=2"></script>
    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                var boot = document.getElementById('boot-screen');
                if (boot) {
                    boot.classList.add('fade-out');
                    setTimeout(function() { boot.remove(); }, 600);
                }
                document.getElementById('mainNav').style.display = '';
                document.getElementById('mainContent').style.display = '';
                document.getElementById('mainFooter').style.display = '';
            }, 2200);
        });
        window.addEventListener('error', function(e) {
            var errEl = document.getElementById('boot-error');
            if (errEl) {
                errEl.style.display = 'block';
                errEl.textContent = 'Erro: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')';
            }
        }, true);
    </script>
</body>
</html>
