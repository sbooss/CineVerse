<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINE BOSS - Streaming</title>
    <meta name="description" content="CINE BOSS - A melhor plataforma de streaming. Filmes, Series, Animes e TV Ao Vivo em Portugues.">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="stylesheet" href="style.css?v=4">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        #boot-screen{position:fixed;inset:0;z-index:99999;background:#050508;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .6s ease}
        #boot-screen.fade-out{opacity:0;pointer-events:none}
        #boot-screen .logo-big{font-family:'Orbitron',monospace;font-size:clamp(36px,6vw,60px);font-weight:900;letter-spacing:4px}
        #boot-screen .logo-big .boss{color:#00d4ff;text-shadow:0 0 40px rgba(0,212,255,.9),0 0 80px rgba(0,212,255,.4)}
        #boot-screen .loader{width:220px;height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
        #boot-screen .loader-bar{height:100%;width:0%;background:linear-gradient(90deg,#00d4ff,#7b2fff,#00d4ff);background-size:200% 100%;animation:bootLoad 2.2s ease forwards,shimmerLoad .8s linear infinite}
        #boot-screen .boot-text{color:#4a4a6a;font-size:13px;font-family:'Inter',sans-serif;letter-spacing:3px;text-transform:uppercase}
        @keyframes bootLoad{0%{width:0%}40%{width:60%}100%{width:100%}}
        @keyframes shimmerLoad{0%{background-position:200% center}100%{background-position:-200% center}}
        #boot-error{display:none;color:#ff2d95;margin-top:8px;font-size:12px;max-width:400px;text-align:center}
    </style>
</head>
<body>
    <div id="boot-screen">
        <div class="logo-big">CINE <span class="boss">BOSS</span></div>
        <div class="loader"><div class="loader-bar"></div></div>
        <div class="boot-text">Preparando sua experiencia...</div>
        <div id="boot-error"></div>
    </div>

    <nav class="navbar" style="display:none" id="mainNav">
        <div class="nav-container">
            <a href="#" class="logo" onclick="goHome()">
                <div class="logo-icon"><i class="fas fa-play"></i></div>
                <span class="logo-text">CINE <span class="accent">BOSS</span></span>
            </a>
            <div class="nav-center">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Buscar filmes, series, animes..." autocomplete="off">
                    <i class="fas fa-search search-icon"></i>
                    <div class="search-filters">
                        <button class="filter-btn active" data-filter="all">Todos</button>
                        <button class="filter-btn" data-filter="movie">Filmes</button>
                        <button class="filter-btn" data-filter="tv">Series</button>
                        <button class="filter-btn" data-filter="anime">Anime</button>
                    </div>
                </div>
            </div>
            <div class="nav-right">
                <div class="nav-links">
                    <a href="#" class="active" data-category="home"><i class="fas fa-home"></i><span>Inicio</span></a>
                    <a href="#" data-category="movie"><i class="fas fa-film"></i><span>Filmes</span></a>
                    <a href="#" data-category="tv"><i class="fas fa-tv"></i><span>Series</span></a>
                    <a href="#" data-category="anime"><i class="fas fa-dragon"></i><span>Anime</span></a>
                    <a href="#" data-category="live"><i class="fas fa-broadcast-tower"></i><span>TV Ao Vivo</span></a>
                    <a href="#" data-category="favorites"><i class="fas fa-heart"></i><span>Favoritos</span></a>
                </div>
                <div class="user-profile"><i class="fas fa-user-circle"></i></div>
            </div>
        </div>
    </nav>

    <main class="main-content" id="mainContent" style="display:none"></main>

    <div class="detail-page" id="detailPage" style="display:none">
        <div class="detail-hero" id="detailHero">
            <div class="detail-hero-bg" id="detailHeroBg"></div>
            <div class="detail-hero-gradient"></div>
            <button class="detail-back" id="detailBack"><i class="fas fa-arrow-left"></i><span>Voltar</span></button>
            <div class="detail-hero-content">
                <div class="detail-poster" id="detailPoster"></div>
                <div class="detail-info">
                    <div class="detail-badges" id="detailBadges"></div>
                    <h1 class="detail-title" id="detailTitle"></h1>
                    <div class="detail-meta" id="detailMeta"></div>
                    <p class="detail-overview" id="detailOverview"></p>
                    <div class="detail-actions">
                        <button class="detail-btn-play" id="detailBtnPlay"><i class="fas fa-play"></i> Assistir</button>
                        <button class="detail-btn-fav" id="detailBtnFav"><i class="fas fa-heart"></i> Favoritar</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="detail-body" id="detailBody">
            <div class="detail-section" id="detailSeasonsSection" style="display:none">
                <div class="season-selector" id="seasonSelector"></div>
            </div>
            <div class="detail-section" id="detailEpisodesSection">
                <div class="episodes-container" id="detailEpisodesContainer"></div>
            </div>
            <div class="detail-section" id="detailSimilarSection">
                <h2 class="detail-section-title">Titulos Semelhantes</h2>
                <div class="movies-row" id="detailSimilar"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="movieModal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
            <div class="modal-hero" id="modalHero"></div>
            <div class="modal-body">
                <div class="modal-poster" id="modalPoster"></div>
                <div class="modal-info">
                    <h2 class="modal-title" id="modalTitle"></h2>
                    <div class="modal-meta">
                        <span class="meta-badge rating"><i class="fas fa-star"></i> <span id="modalRating"></span></span>
                        <span class="meta-badge"><i class="fas fa-calendar"></i> <span id="modalYear"></span></span>
                        <span class="meta-badge"><i class="fas fa-clock"></i> <span id="modalDuration"></span></span>
                        <span class="meta-badge genre" id="modalGenre"></span>
                    </div>
                    <p class="modal-desc" id="modalDesc"></p>
                    <div class="modal-tags" id="modalTags"></div>
                    <div class="modal-buttons">
                        <button class="btn-primary" id="modalPlay"><i class="fas fa-play"></i> ASSISTIR</button>
                        <button class="btn-secondary" id="modalFav"><i class="fas fa-heart"></i> FAVORITAR</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="player-overlay" id="playerOverlay">
        <div class="player-bg"></div>
        <div class="player-container">
            <div class="player-header">
                <button class="player-back" id="playerBack"><i class="fas fa-arrow-left"></i></button>
                <h3 class="player-title" id="playerTitle"></h3>
            </div>
            <div class="player-wrapper" id="playerWrapper"></div>
        </div>
    </div>

    <footer class="footer" id="mainFooter" style="display:none">
        <div class="footer-content">
            <div class="footer-logo">
                <span class="logo-text">CINE <span class="accent">BOSS</span></span>
                <p>Sua experiencia de streaming definitiva</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 CINE BOSS. Dados de TMDB.</p>
        </div>
    </footer>

    <script src="config.js?v=4"></script>
    <script src="tmdb.js?v=4"></script>
    <script src="player.js?v=4"></script>
    <script src="app.js?v=4"></script>
    <script>

            audio.play().catch(function(){});
            setTimeout(function() {
                var boot = document.getElementById('boot-screen');
                if (boot) {
                    boot.classList.add('fade-out');
                    setTimeout(function() { boot.remove(); }, 700);
                }
                document.getElementById('mainNav').style.display = '';
                document.getElementById('mainContent').style.display = '';
                document.getElementById('mainFooter').style.display = '';
            }, 2400);
        });
        window.addEventListener('error', function(e) {
            var errEl = document.getElementById('boot-error');
            if (errEl) {
                errEl.style.display = 'block';
                errEl.textContent = 'Erro: ' + e.message;
            }
        }, true);
    </script>
</body>
</html>
