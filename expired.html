<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINE BOSS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #050508;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .expired-container {
            max-width: 500px;
            padding: 40px;
            text-align: center;
        }
        .expired-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #ff3b30;
        }
        .expired-title {
            font-family: 'Orbitron', monospace;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .expired-text {
            color: #b0b0cc;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .renew-btn {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(135deg, #00d4ff, #7b2fff);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            letter-spacing: 1px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .renew-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="expired-container">
        <div class="expired-icon">
            <i class="fas fa-clock-rotate-left"></i>
        </div>
        <h1 class="expired-title">Assinatura Expirada</h1>
        <p class="expired-text">
            Sua assinatura CINE BOSS expirou. Para continuar assistindo todo o conteudo da plataforma, renove seu acesso.
        </p>
        <a href="/payment.html" class="renew-btn">RENOVAR ACESSO</a>
    </div>
</body>
</html>
