<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050508">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>CINE BOSS - Entrar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-deep: #050508;
            --bg-primary: #08080e;
            --bg-card: #10101c;
            --bg-elevated: #16162a;
            --accent-blue: #00a8e0;
            --accent-blue-bright: #00d4ff;
            --accent-gold: #c9a54e;
            --accent-gold-bright: #e0be6a;
            --text-primary: #e8e8f0;
            --text-secondary: #8a8aa0;
            --text-muted: #4a4a60;
            --border-subtle: rgba(255,255,255,0.04);
            --border-medium: rgba(255,255,255,0.08);
            --border-accent: rgba(0,168,224,0.2);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh; width: 100vw;
        }

        /* ===== CINEMATIC BACKGROUND ===== */
        .cinema-bg {
            position: fixed; inset: 0; z-index: 0;
            overflow: hidden; perspective: 800px;
        }
        .bg-gradient {
            position: absolute; inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(0,168,224,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 30%, rgba(201,165,78,0.04) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 80%, rgba(0,0,0,0.8) 0%, transparent 60%);
            z-index: 5;
        }
        .vignette {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(5,5,8,0.85) 100%);
            z-index: 6;
        }
        .cinema-mask {
            position: absolute; inset: 0; z-index: 7;
            pointer-events: none;
        }
        .cinema-mask::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, rgba(5,5,8,0.9) 0%, transparent 15%, transparent 85%, rgba(5,5,8,0.9) 100%);
        }
        .cinema-mask::after {
            content: ''; position: absolute; left: 0; right: 0; bottom: 0;
            height: 40%;
            background: linear-gradient(0deg, rgba(5,5,8,0.95) 0%, transparent 100%);
        }

        /* ===== POSTER ROWS ===== */
        .poster-row {
            position: absolute; display: flex; gap: 6px;
            will-change: transform;
        }
        .poster-row img {
            width: 100px; height: 150px;
            object-fit: cover; border-radius: 4px;
            opacity: 0.18; filter: brightness(0.5) saturate(0.6);
            transition: opacity 0.3s;
        }
        .poster-row.depth-1 { top: 5%; animation: scrollRight 85s linear infinite; }
        .poster-row.depth-2 { top: 25%; animation: scrollLeft 95s linear infinite; opacity: 0.7; }
        .poster-row.depth-2 img { opacity: 0.12; filter: brightness(0.3) saturate(0.4) blur(1px); transform: scale(1.1); }
        .poster-row.depth-3 { top: 50%; animation: scrollRight 75s linear infinite; }
        .poster-row.depth-3 img { opacity: 0.22; filter: brightness(0.6) saturate(0.7); }
        .poster-row.depth-4 { top: 70%; animation: scrollLeft 105s linear infinite; }
        .poster-row.depth-4 img { opacity: 0.08; filter: brightness(0.25) saturate(0.3) blur(2px); transform: scale(1.2); }
        .poster-row.depth-5 { top: 85%; animation: scrollRight 90s linear infinite; }
        .poster-row.depth-5 img { opacity: 0.15; filter: brightness(0.4) saturate(0.5); }

        @keyframes scrollRight {
            from { transform: translateX(-20%); }
            to { transform: translateX(-50%); }
        }
        @keyframes scrollLeft {
            from { transform: translateX(-50%); }
            to { transform: translateX(-20%); }
        }

        /* ===== LIGHT ORBS ===== */
        .light-orb {
            position: absolute; border-radius: 50%;
            filter: blur(80px); opacity: 0.15;
            animation: orbFloat 20s ease-in-out infinite;
            pointer-events: none;
        }
        .orb-1 { width: 300px; height: 300px; background: var(--accent-blue); top: 10%; left: 15%; animation-delay: 0s; }
        .orb-2 { width: 250px; height: 250px; background: var(--accent-gold); top: 60%; right: 10%; animation-delay: -7s; }
        .orb-3 { width: 200px; height: 200px; background: #7b2fff; bottom: 20%; left: 40%; animation-delay: -13s; }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.1); }
            66% { transform: translate(-20px, 15px) scale(0.95); }
        }

        /* ===== PARTICLES ===== */
        .particle {
            position: absolute; border-radius: 50%;
            pointer-events: none;
            animation: particleFloat 12s ease-in-out infinite;
        }
        @keyframes particleFloat {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
            25% { transform: translateY(-40px) translateX(15px); opacity: 0.6; }
            50% { transform: translateY(-15px) translateX(-10px); opacity: 0.4; }
            75% { transform: translateY(-50px) translateX(8px); opacity: 0.5; }
        }

        /* ===== AUTH CARD ===== */
        .auth-wrapper {
            position: fixed; inset: 0; z-index: 10;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .auth-card {
            position: relative; width: 100%; max-width: 400px;
            background: rgba(12, 12, 22, 0.88);
            backdrop-filter: blur(40px) saturate(1.4);
            -webkit-backdrop-filter: blur(40px) saturate(1.4);
            border: 1px solid var(--border-medium);
            border-radius: 16px;
            padding: 36px 28px;
            z-index: 2;
            opacity: 0; transform: translateY(30px) scale(0.97);
            animation: cardAppear 0.6s 0.3s var(--ease-smooth) forwards;
        }
        .auth-card::before {
            content: ''; position: absolute;
            top: 0; left: 20%; right: 20%; height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
            opacity: 0.5;
        }
        @keyframes cardAppear {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== LOGO ===== */
        .auth-logo {
            text-align: center; margin-bottom: 28px;
        }
        .auth-logo-text {
            font-family: 'Sora', 'Inter', sans-serif;
            font-size: 24px; font-weight: 800;
            letter-spacing: 3px;
            color: var(--text-primary);
        }
        .auth-logo-text .accent { color: var(--accent-blue); }
        .auth-logo-sub {
            font-size: 9px; color: var(--text-muted);
            letter-spacing: 5px; text-transform: uppercase;
            margin-top: 4px;
        }

        /* ===== TABS ===== */
        .auth-tabs {
            display: flex; gap: 3px;
            margin-bottom: 24px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px; padding: 3px;
        }
        .auth-tab {
            flex: 1; padding: 10px;
            background: none; border: none;
            color: var(--text-muted);
            font-size: 13px; font-weight: 600;
            cursor: pointer; border-radius: 6px;
            transition: all 0.2s;
        }
        .auth-tab.active {
            background: rgba(0,168,224,0.1);
            color: var(--accent-blue);
        }
        .auth-tab:hover:not(.active) { color: var(--text-secondary); }

        /* ===== FORMS ===== */
        .auth-form { display: none; flex-direction: column; gap: 14px; }
        .auth-form.active { display: flex; }
        .auth-field { position: relative; }
        .auth-field input {
            width: 100%; padding: 12px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-subtle);
            border-radius: 8px; color: var(--text-primary);
            font-size: 13px; outline: none;
            transition: all 0.2s;
        }
        .auth-field input:focus {
            border-color: var(--border-accent);
            background: rgba(255,255,255,0.06);
        }
        .auth-field input::placeholder { color: var(--text-muted); }
        .auth-check {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; color: var(--text-muted);
        }
        .auth-check input { accent-color: var(--accent-blue); }
        .auth-error {
            color: #ff4466; font-size: 12px;
            min-height: 16px; text-align: center;
        }
        .auth-btn {
            width: 100%; padding: 13px;
            background: var(--accent-blue);
            border: none; border-radius: 8px;
            color: #fff; font-size: 13px; font-weight: 700;
            letter-spacing: 0.5px; cursor: pointer;
            transition: all 0.25s;
            position: relative; overflow: hidden;
        }
        .auth-btn:hover {
            background: #0090c0;
            box-shadow: 0 0 24px rgba(0,168,224,0.25);
            transform: translateY(-1px);
        }
        .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .auth-btn::after {
            content: ''; position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        .auth-btn:hover::after { left: 100%; }
        .auth-forgot {
            text-align: center; font-size: 12px;
            color: var(--text-muted); cursor: pointer;
            transition: color 0.2s;
        }
        .auth-forgot:hover { color: var(--accent-blue); }

        /* ===== SOUND TOGGLE ===== */
        .sound-toggle {
            position: fixed; top: 16px; right: 16px; z-index: 20;
            width: 36px; height: 36px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-subtle);
            border-radius: 50%;
            color: var(--text-muted);
            font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .sound-toggle:hover { color: var(--text-primary); background: rgba(255,255,255,0.08); }
        .sound-toggle.muted { color: var(--accent-gold); }

        /* ===== SUCCESS OVERLAY ===== */
        .success-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: var(--bg-deep);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.4s;
        }
        .success-overlay.active { opacity: 1; pointer-events: all; }
        .success-icon {
            width: 64px; height: 64px;
            background: rgba(0,168,224,0.1);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: var(--accent-blue);
            margin-bottom: 16px;
            animation: successPop 0.4s var(--ease-spring);
        }
        @keyframes successPop {
            from { transform: scale(0); } to { transform: scale(1); }
        }
        .success-text {
            font-family: 'Sora', 'Inter', sans-serif;
            font-size: 18px; font-weight: 700;
            color: var(--text-primary);
        }

        /* ===== REDUCED MOTION ===== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- CINEMATIC BACKGROUND -->
    <div class="cinema-bg">
        <div class="poster-row depth-1" id="row1"></div>
        <div class="poster-row depth-2" id="row2"></div>
        <div class="poster-row depth-3" id="row3"></div>
        <div class="poster-row depth-4" id="row4"></div>
        <div class="poster-row depth-5" id="row5"></div>
        <div class="light-orb orb-1"></div>
        <div class="light-orb orb-2"></div>
        <div class="light-orb orb-3"></div>
        <div class="bg-gradient"></div>
        <div class="vignette"></div>
        <div class="cinema-mask"></div>
    </div>

    <!-- SOUND TOGGLE -->
    <button class="sound-toggle" id="soundToggle" title="Ativar/desativar sons">
        <i class="fas fa-volume-high"></i>
    </button>

    <!-- AUTH CARD -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="auth-logo-text">CINE <span class="accent">BOSS</span></div>
                <div class="auth-logo-sub">STREAMING PREMIUM</div>
            </div>
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Entrar</button>
                <button class="auth-tab" data-tab="register">Cadastrar</button>
            </div>
            <form class="auth-form active" id="loginForm">
                <div class="auth-field">
                    <input type="email" id="loginEmail" placeholder="Email" required autocomplete="email">
                </div>
                <div class="auth-field">
                    <input type="password" id="loginPassword" placeholder="Senha" required autocomplete="current-password">
                </div>
                <div class="auth-check">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Lembrar sessao</label>
                </div>
                <div class="auth-error" id="loginError"></div>
                <button type="submit" class="auth-btn" id="loginBtn">ENTRAR</button>
                <div class="auth-forgot" id="forgotPassword">Esqueci minha senha</div>
            </form>
            <form class="auth-form" id="registerForm">
                <div class="auth-field">
                    <input type="text" id="regName" placeholder="Nome" required autocomplete="name">
                </div>
                <div class="auth-field">
                    <input type="email" id="regEmail" placeholder="Email" required autocomplete="email">
                </div>
                <div class="auth-field">
                    <input type="password" id="regPassword" placeholder="Senha (min. 6 caracteres)" required autocomplete="new-password">
                </div>
                <div class="auth-error" id="regError"></div>
                <button type="submit" class="auth-btn" id="regBtn">CADASTRAR</button>
            </form>
        </div>
    </div>

    <!-- SUCCESS OVERLAY -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-icon"><i class="fas fa-check"></i></div>
        <div class="success-text" id="successText">Bem-vindo ao CINE BOSS</div>
    </div>

    <script>
    (function() {
        'use strict';
        const API = window.location.origin + '/api';
        const TMDB_KEY = 'eb9690431d1dd3d86de35def2b1b0a2c';

        /* ===== SOUND SYSTEM ===== */
        const Sound = {
            ctx: null, muted: false,
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            tone(freq, dur, type, vol) {
                if (this.muted || !this.ctx) return;
                const o = this.ctx.createOscillator(), g = this.ctx.createGain();
                o.type = type || 'sine'; o.frequency.value = freq;
                g.gain.setValueAtTime(vol || 0.12, this.ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
                o.connect(g).connect(this.ctx.destination);
                o.start(); o.stop(this.ctx.currentTime + dur);
            },
            success() {
                this.init();
                this.tone(523.25, 0.12, 'sine', 0.1);
                setTimeout(() => this.tone(659.25, 0.12, 'sine', 0.1), 80);
                setTimeout(() => this.tone(783.99, 0.2, 'sine', 0.13), 160);
            },
            error() {
                this.init();
                this.tone(200, 0.2, 'sawtooth', 0.08);
                setTimeout(() => this.tone(150, 0.25, 'sawtooth', 0.06), 120);
            },
            click() { this.init(); this.tone(800, 0.04, 'sine', 0.06); },
            toggle() { this.muted = !this.muted; }
        };

        document.getElementById('soundToggle').addEventListener('click', function() {
            Sound.toggle();
            this.classList.toggle('muted');
            this.querySelector('i').className = Sound.muted ? 'fas fa-volume-xmark' : 'fas fa-volume-high';
        });

        /* ===== POSTER LOADER ===== */
        function loadPosters() {
            fetch(`https://api.themoviedb.org/3/trending/all/week?api_key=${TMDB_KEY}&language=pt-BR`)
                .then(r => r.json())
                .then(data => {
                    const posters = (data.results || [])
                        .filter(i => i.poster_path)
                        .map(i => `https://image.tmdb.org/t/p/w200${i.poster_path}`);
                    if (posters.length === 0) return generateFallback();
                    const rows = ['row1','row2','row3','row4','row5'];
                    rows.forEach(id => {
                        const el = document.getElementById(id);
                        const shuffled = [...posters].sort(() => Math.random() - 0.5);
                        el.innerHTML = (shuffled.concat(shuffled)).map(src =>
                            `<img src="${src}" alt="" loading="lazy">`
                        ).join('');
                    });
                })
                .catch(() => generateFallback());
        }

        function generateFallback() {
            const colors = ['#006688','#8a7035','#1a1a30','#0a3040','#2a1a08'];
            const rows = ['row1','row2','row3','row4','row5'];
            rows.forEach(id => {
                const el = document.getElementById(id);
                let html = '';
                for (let i = 0; i < 15; i++) {
                    const c = colors[Math.floor(Math.random() * colors.length)];
                    html += `<div style="width:100px;height:150px;background:${c};border-radius:4px;opacity:0.15;filter:blur(1px)"></div>`;
                }
                el.innerHTML = html;
            });
        }

        /* ===== PARTICLES ===== */
        function createParticles() {
            const bg = document.querySelector('.cinema-bg');
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 3 + 1;
                const colors = ['rgba(0,168,224,0.4)','rgba(201,165,78,0.3)','rgba(255,255,255,0.3)'];
                p.style.cssText = `
                    width:${size}px;height:${size}px;
                    background:${colors[Math.floor(Math.random()*colors.length)]};
                    left:${Math.random()*100}%;top:${Math.random()*100}%;
                    animation-delay:${-Math.random()*12}s;
                    animation-duration:${8+Math.random()*8}s;
                `;
                bg.appendChild(p);
            }
        }

        /* ===== TABS ===== */
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                Sound.click();
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                this.classList.add('active');
                document.getElementById(this.dataset.tab + 'Form').classList.add('active');
            });
        });

        /* ===== PASSWORD TOGGLE ===== */
        document.querySelectorAll('.auth-field input[type="password"]').forEach(input => {
            const wrap = input.parentElement;
            const toggle = document.createElement('span');
            toggle.innerHTML = '<i class="fas fa-eye" style="cursor:pointer;position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:13px"></i>';
            wrap.style.position = 'relative';
            wrap.appendChild(toggle);
            toggle.addEventListener('click', function() {
                Sound.click();
                const icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.replace('fa-eye', 'fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.replace('fa-eye-slash', 'fa-eye');
                }
            });
        });

        /* ===== LOGIN ===== */
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const errEl = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');
            errEl.textContent = '';
            btn.disabled = true;
            btn.textContent = 'ENTRANDO...';
            try {
                const r = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value,
                        password: document.getElementById('loginPassword').value,
                        remember: document.getElementById('rememberMe').checked
                    })
                });
                const data = await r.json();
                if (!r.ok) throw new Error(data.error);
                Sound.success();
                showSuccess('Bem-vindo, ' + (data.user.name || 'usuario') + '!');
                setTimeout(() => window.location.href = '/', 1200);
            } catch (err) {
                errEl.textContent = err.message;
                Sound.error();
                btn.disabled = false;
                btn.textContent = 'ENTRAR';
            }
        });

        /* ===== REGISTER ===== */
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const errEl = document.getElementById('regError');
            const btn = document.getElementById('regBtn');
            errEl.textContent = '';
            btn.disabled = true;
            btn.textContent = 'CADASTRANDO...';
            try {
                const name = document.getElementById('regName').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const password = document.getElementById('regPassword').value;
                if (name.length < 2) throw new Error('Nome deve ter pelo menos 2 caracteres');
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error('Email invalido');
                if (password.length < 6) throw new Error('Senha deve ter pelo menos 6 caracteres');
                const r = await fetch(`${API}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ name, email, password })
                });
                const data = await r.json();
                if (!r.ok) throw new Error(data.error);
                Sound.success();
                showSuccess('Conta criada com sucesso!');
                setTimeout(() => {
                    document.querySelectorAll('.auth-tab')[0].click();
                    document.getElementById('loginEmail').value = email;
                    document.getElementById('loginPassword').value = password;
                    document.getElementById('loginError').textContent = 'Conta criada! Faca login.';
                    document.getElementById('loginError').style.color = 'var(--accent-blue)';
                }, 1200);
            } catch (err) {
                errEl.textContent = err.message;
                Sound.error();
                btn.disabled = false;
                btn.textContent = 'CADASTRAR';
            }
        });

        /* ===== FORGOT PASSWORD ===== */
        document.getElementById('forgotPassword').addEventListener('click', async function() {
            const email = document.getElementById('loginEmail').value;
            if (!email) {
                document.getElementById('loginError').textContent = 'Informe seu email primeiro';
                return;
            }
            try {
                await fetch(`${API}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                document.getElementById('loginError').textContent = 'Se o email existir, voce recebera as instrucoes.';
                document.getElementById('loginError').style.color = 'var(--accent-blue)';
            } catch {
                document.getElementById('loginError').textContent = 'Erro ao enviar email.';
            }
        });

        /* ===== SUCCESS OVERLAY ===== */
        function showSuccess(text) {
            document.getElementById('successText').textContent = text;
            document.getElementById('successOverlay').classList.add('active');
        }

        /* ===== CHECK EXISTING SESSION ===== */
        fetch(`${API}/auth/me`, { credentials: 'include' })
            .then(r => r.json())
            .then(data => {
                if (data.loggedIn) window.location.href = '/';
            })
            .catch(() => {});

        /* ===== INIT ===== */
        document.addEventListener('click', () => Sound.init(), { once: true });
        loadPosters();
        createParticles();
    })();
    </script>
</body>
</html>
