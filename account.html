<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050508">
    <title>Minha Conta - CINE BOSS | Gerenciar Assinatura</title>
    <meta name="description" content="Gerencie sua conta CINE BOSS. Veja sua assinatura, historico de assistidos e preferencias.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://cineboss.vercel.app/account.html">
    <meta property="og:title" content="Minha Conta - CINE BOSS">
    <meta property="og:description" content="Gerencie sua conta CINE BOSS.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cineboss.vercel.app/account.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-deep: #050508;
            --bg-primary: #08080e;
            --bg-elevated: #16162a;
            --accent-blue: #00a8e0;
            --accent-gold: #c9a54e;
            --text-primary: #e8e8f0;
            --text-secondary: #8a8aa0;
            --text-muted: #4a4a60;
            --border-subtle: rgba(255,255,255,0.04);
            --border-medium: rgba(255,255,255,0.08);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-deep); color: var(--text-primary);
            min-height: 100vh;
        }
        .header {
            padding: 16px 24px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-subtle);
        }
        .header-inner {
            max-width: 800px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
        }
        .header-logo {
            font-family: 'Sora', sans-serif;
            font-size: 16px; font-weight: 700;
            letter-spacing: 1.5px;
        }
        .header-logo .accent { color: var(--accent-blue); }
        .header-back {
            font-size: 13px; color: var(--text-muted);
            display: flex; align-items: center; gap: 6px;
            transition: color 0.2s;
        }
        .header-back:hover { color: var(--text-primary); }
        .container { max-width: 800px; margin: 0 auto; padding: 32px 24px; }
        .page-title {
            font-family: 'Sora', sans-serif;
            font-size: 24px; font-weight: 700;
            margin-bottom: 24px;
        }
        .account-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-medium);
            border-radius: 14px; padding: 28px 24px;
            margin-bottom: 20px;
        }
        .card-label {
            font-size: 11px; color: var(--text-muted);
            letter-spacing: 1px; text-transform: uppercase;
            margin-bottom: 12px;
        }
        .info-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .info-item { }
        .info-label {
            font-size: 11px; color: var(--text-muted);
            margin-bottom: 4px;
        }
        .info-value {
            font-size: 15px; font-weight: 600;
            color: var(--text-primary);
        }
        .info-value.active { color: var(--accent-blue); }
        .info-value.expired { color: #ff4466; }
        .info-value.pending { color: var(--accent-gold); }
        .status-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px; font-weight: 600;
        }
        .status-badge.active {
            background: rgba(0,168,224,0.1);
            color: var(--accent-blue);
            border: 1px solid rgba(0,168,224,0.2);
        }
        .status-badge.expired {
            background: rgba(255,68,102,0.1);
            color: #ff4466;
            border: 1px solid rgba(255,68,102,0.2);
        }
        .status-badge.pending {
            background: rgba(201,165,78,0.1);
            color: var(--accent-gold);
            border: 1px solid rgba(201,165,78,0.2);
        }
        .status-badge i { font-size: 8px; }
        .action-btn {
            width: 100%; padding: 14px;
            background: var(--accent-blue);
            border: none; border-radius: 10px;
            color: #fff; font-size: 14px; font-weight: 700;
            letter-spacing: 0.5px; cursor: pointer;
            transition: all 0.25s;
        }
        .action-btn:hover {
            background: #0090c0;
            box-shadow: 0 0 24px rgba(0,168,224,0.25);
            transform: translateY(-1px);
        }
        .logout-btn {
            width: 100%; padding: 14px;
            background: rgba(255,68,102,0.08);
            border: 1px solid rgba(255,68,102,0.15);
            border-radius: 10px;
            color: #ff4466; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.25s;
            margin-top: 10px;
        }
        .logout-btn:hover {
            background: rgba(255,68,102,0.15);
            border-color: rgba(255,68,102,0.3);
        }
        .loading { text-align: center; padding: 60px; color: var(--text-muted); }
        @media (max-width: 600px) {
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <a href="/" class="header-logo">CINE <span class="accent">BOSS</span></a>
            <a href="/" class="header-back"><i class="fas fa-arrow-left"></i> Voltar</a>
        </div>
    </div>
    <div class="container">
        <h1 class="page-title">Minha Conta</h1>
        <div id="accountContent"><div class="loading">Carregando...</div></div>
    </div>

    <script>
    (function() {
        const API = window.location.origin + '/api';

        fetch(`${API}/auth/me`, { credentials: 'include' })
            .then(r => r.json())
            .then(data => {
                if (!data.loggedIn) {
                    window.location.href = '/login.html';
                    return;
                }
                renderAccount(data);
            })
            .catch(() => { window.location.href = '/login.html'; });

        function renderAccount(data) {
            const user = data.user;
            const sub = data.subscription;
            const content = document.getElementById('accountContent');

            let subHTML = '';
            if (sub && sub.status === 'active') {
                const expires = new Date(sub.expires_at);
                const now = new Date();
                const daysLeft = Math.ceil((expires - now) / (1000 * 60 * 60 * 24));
                const planName = sub.plan === 'monthly' ? 'MENSAL (30 dias)' : 'TRIMESTRAL (90 dias)';
                subHTML = `
                    <div class="account-card">
                        <div class="card-label">Assinatura</div>
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-label">Plano</div>
                                <div class="info-value">${planName}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Status</div>
                                <div class="info-value"><span class="status-badge active"><i class="fas fa-circle"></i> Ativo</span></div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Inicio</div>
                                <div class="info-value">${new Date(sub.activated_at || sub.created_at).toLocaleDateString('pt-BR')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Expira em</div>
                                <div class="info-value">${expires.toLocaleDateString('pt-BR')} (${daysLeft} dias restantes)</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (sub && sub.status === 'expired') {
                subHTML = `
                    <div class="account-card">
                        <div class="card-label">Assinatura</div>
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-label">Status</div>
                                <div class="info-value"><span class="status-badge expired"><i class="fas fa-circle"></i> Expirado</span></div>
                            </div>
                        </div>
                        <a href="/payment.html" class="action-btn" style="display:block;text-align:center;margin-top:16px;text-decoration:none">RENOVAR ACESSO</a>
                    </div>
                `;
            } else {
                subHTML = `
                    <div class="account-card">
                        <div class="card-label">Assinatura</div>
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-label">Status</div>
                                <div class="info-value"><span class="status-badge pending"><i class="fas fa-circle"></i> Sem assinatura</span></div>
                            </div>
                        </div>
                        <a href="/payment.html" class="action-btn" style="display:block;text-align:center;margin-top:16px;text-decoration:none">ASSINAR AGORA</a>
                    </div>
                `;
            }

            content.innerHTML = `
                <div class="account-card">
                    <div class="card-label">Dados Pessoais</div>
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Nome</div>
                            <div class="info-value">${user.name}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Email</div>
                            <div class="info-value">${user.email}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Membro desde</div>
                            <div class="info-value">${new Date(user.created_at).toLocaleDateString('pt-BR')}</div>
                        </div>
                    </div>
                </div>
                ${subHTML}
                <button class="logout-btn" onclick="logout()">Sair da conta</button>
            `;
        }

        window.logout = async function() {
            await fetch(`${API}/auth/logout`, { method: 'POST', credentials: 'include' });
            window.location.href = '/login.html';
        };
    })();
    </script>
</body>
</html>
