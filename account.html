<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Conta - CINE BOSS | Gerenciar Assinatura</title>
    <meta name="description" content="Gerencie sua conta CINE BOSS. Veja sua assinatura, historico de assistidos e preferencias.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://cineboss.online/account.html">
    <meta property="og:title" content="Minha Conta - CINE BOSS">
    <meta property="og:description" content="Gerencie sua conta CINE BOSS.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cineboss.online/account.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-deep: #050508;
            --bg-primary: #08080e;
            --bg-elevated: #16162a;
            --accent-blue: #00a8e0;
            --accent-gold: #c9a54e;
            --text-primary: #e8e8f0;
            --text-secondary: #8a8aa0;
            --text-muted: #4a4a60;
            --border-subtle: rgba(255,255,255,0.04);
            --border-medium: rgba(255,255,255,0.08);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-deep); color: var(--text-primary);
            min-height: 100vh;
        }
        .header {
            padding: 16px 24px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-subtle);
        }
        .header-inner {
            max-width: 800px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
        }
        .header-logo {
            font-family: 'Sora', sans-serif;
            font-size: 16px; font-weight: 700;
            letter-spacing: 1.5px;
        }
        .header-logo .accent { color: var(--accent-blue); }
        .header-back {
            font-size: 13px; color: var(--text-muted);
            display: flex; align-items: center; gap: 6px;
            transition: color 0.2s;
        }
        .header-back:hover { color: var(--text-primary); }
        .container { max-width: 800px; margin: 0 auto; padding: 32px 24px; }
        .page-title {
            font-family: 'Sora', sans-serif;
            font-size: 24px; font-weight: 700;
            margin-bottom: 24px;
        }
        .account-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-medium);
            border-radius: 14px; padding: 28px 24px;
            margin-bottom: 20px;
        }
        .card-label {
            font-size: 11px; color: var(--text-muted);
            letter-spacing: 1px; text-transform: uppercase;
            margin-bottom: 12px;
        }
        .info-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .info-item { }
        .info-label {
            font-size: 11px; color: var(--text-muted);
            margin-bottom: 4px;
        }
        .info-value {
            font-size: 15px; font-weight: 600;
            color: var(--text-primary);
        }
        .info-value.active { color: var(--accent-blue); }
        .info-value.expired { color: #ff4466; }
        .info-value.pending { color: var(--accent-gold); }
        .status-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px; font-weight: 600;
        }
        .status-badge.active {
            background: rgba(0,168,224,0.1);
            color: var(--accent-blue);
            border: 1px solid rgba(0,168,224,0.2);
        }
        .status-badge.expired {
            background: rgba(255,68,102,0.1);
            color: #ff4466;
            border: 1px solid rgba(255,68,102,0.2);
        }
        .status-badge.pending {
            background: rgba(201,165,78,0.1);
            color: var(--accent-gold);
            border: 1px solid rgba(201,165,78,0.2);
        }
        .status-badge i { font-size: 8px; }
        .action-btn {
            width: 100%; padding: 14px;
            background: var(--accent-blue);
            border: none; border-radius: 10px;
            color: #fff; font-size: 14px; font-weight: 700;
            letter-spacing: 0.5px; cursor: pointer;
            transition: all 0.25s;
        }
        .action-btn:hover {
            background: #0090c0;
            box-shadow: 0 0 24px rgba(0,168,224,0.25);
            transform: translateY(-1px);
        }
        .logout-btn {
            width: 100%; padding: 14px;
            background: rgba(255,68,102,0.08);
            border: 1px solid rgba(255,68,102,0.15);
            border-radius: 10px;
            color: #ff4466; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.25s;
            margin-top: 10px;
        }
        .logout-btn:hover {
            background: rgba(255,68,102,0.15);
            border-color: rgba(255,68,102,0.3);
        }
        .loading { text-align: center; padding: 60px; color: var(--text-muted); }
        .device-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 14px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            margin-bottom: 8px;
        }
        .device-info { display: flex; align-items: center; gap: 10px; flex: 1; }
        .device-icon { width: 36px; height: 36px; border-radius: 8px; background: rgba(0,168,224,0.08); display: flex; align-items: center; justify-content: center; color: var(--accent-blue); font-size: 14px; flex-shrink: 0; }
        .device-icon.current { background: rgba(0,168,224,0.15); border: 1px solid rgba(0,168,224,0.3); }
        .device-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
        .device-details { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .device-remove {
            background: rgba(255,68,102,0.08); border: 1px solid rgba(255,68,102,0.15);
            border-radius: 6px; padding: 6px 10px; color: #ff4466;
            font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .device-remove:hover { background: rgba(255,68,102,0.15); border-color: rgba(255,68,102,0.3); }
        .device-current-badge { font-size: 10px; color: var(--accent-blue); font-weight: 600; background: rgba(0,168,224,0.1); padding: 2px 8px; border-radius: 4px; }
        .devices-limit { font-size: 11px; color: var(--text-muted); margin-top: 12px; text-align: center; }
        .devices-limit i { color: var(--accent-gold); margin-right: 4px; }
        @media (max-width: 600px) {
            .info-grid { grid-template-columns: 1fr; }
            .device-item { flex-direction: column; align-items: flex-start; gap: 10px; }
            .device-remove { width: 100%; text-align: center; }
        }
    </style>

</head>
<body>
    <a href="/donate.html" style="position:fixed;top:0;left:0;right:0;z-index:10001;background:linear-gradient(135deg,#c9a54e,#e8c86a,#c9a54e);background-size:200% 200%;animation:goldShimmer 2s ease-in-out infinite;text-align:center;padding:8px 16px;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 2px 12px rgba(201,165,78,0.4)">
        <i class="fas fa-heart" style="color:#050508;font-size:14px"></i>
        <span style="font-family:'Sora',sans-serif;font-size:13px;font-weight:700;color:#050508;letter-spacing:0.5px">Doe para ajudar o CINE BOSS</span>
        <i class="fas fa-heart" style="color:#050508;font-size:14px"></i>
    </a>
    <style>@keyframes goldShimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}</style>
    <div class="header">
        <div class="header-inner">
            <a href="/" class="header-logo">CINE <span class="accent">BOSS</span></a>
            <a href="/" class="header-back"><i class="fas fa-arrow-left"></i> Voltar</a>
        </div>
    </div>
    <div class="container">
        <h1 class="page-title">Minha Conta</h1>
        <div id="accountContent"><div class="loading">Carregando...</div></div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-brand">
                <img src="https://imgur.com/6opzHhy.png" alt="CINE BOSS" class="footer-logo">
                <p class="footer-tagline">Streaming premium brasileiro.</p>
            </div>
            <div class="footer-links">
                <a href="/about.html">Sobre</a>
                <a href="/terms.html">Termos de Uso</a>
                <a href="/privacy.html">Politica de Privacidade</a>
                <a href="/payment.html">Planos e Precos</a>
                <a href="/donate.html">Doe para ajudar</a>
                <a href="mailto:williannunes31994@gmail.com">Contato</a>
            </div>
            <div class="footer-legal">
                <p>2026 CINE BOSS. Todos os direitos reservados.</p>
                <p>Feito com <i class="fas fa-heart" style="color: var(--gold);"></i> no Brasil.</p>
            </div>
        </div>
    </footer>

    <script>
    (function() {
        const API = window.location.origin + '/api';

        fetch(`${API}/auth/me`, { credentials: 'include' })
            .then(r => r.json())
            .then(data => {
                if (!data.loggedIn) {
                    window.location.href = '/login.html';
                    return;
                }
                renderAccount(data);
            })
            .catch(() => { window.location.href = '/login.html'; });

        function renderAccount(data) {
            const user = data.user;
            const sub = data.subscription;
            const devices = data.devices || [];
            const content = document.getElementById('accountContent');

            let subHTML = '';
            if (sub && sub.status === 'active') {
                const expires = new Date(sub.expires_at);
                const now = new Date();
                const daysLeft = Math.ceil((expires - now) / (1000 * 60 * 60 * 24));
                const planName = sub.plan === 'monthly' ? 'MENSAL (30 dias)' : 'TRIMESTRAL (90 dias)';
                subHTML = `
                    <div class="account-card">
                        <div class="card-label">Assinatura</div>
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-label">Plano</div>
                                <div class="info-value">${planName}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Status</div>
                                <div class="info-value"><span class="status-badge active"><i class="fas fa-circle"></i> Ativo</span></div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Inicio</div>
                                <div class="info-value">${new Date(sub.activated_at || sub.created_at).toLocaleDateString('pt-BR')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Expira em</div>
                                <div class="info-value">${expires.toLocaleDateString('pt-BR')} (${daysLeft} dias restantes)</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (sub && sub.status === 'expired') {
                subHTML = `
                    <div class="account-card">
                        <div class="card-label">Assinatura</div>
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-label">Status</div>
                                <div class="info-value"><span class="status-badge expired"><i class="fas fa-circle"></i> Expirado</span></div>
                            </div>
                        </div>
                        <a href="/payment.html" class="action-btn" style="display:block;text-align:center;margin-top:16px;text-decoration:none">RENOVAR ACESSO</a>
                    </div>
                `;
            } else {
                subHTML = `
                    <div class="account-card">
                        <div class="card-label">Assinatura</div>
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-label">Status</div>
                                <div class="info-value"><span class="status-badge pending"><i class="fas fa-circle"></i> Sem assinatura</span></div>
                            </div>
                        </div>
                        <a href="/payment.html" class="action-btn" style="display:block;text-align:center;margin-top:16px;text-decoration:none">ASSINAR AGORA</a>
                    </div>
                `;
            }

            let devicesHTML = '<div class="account-card"><div class="card-label">Dispositivos Ativos (' + devices.length + '/2)</div>';
            if (devices.length === 0) {
                devicesHTML += '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px">Nenhum dispositivo ativo</div>';
            } else {
                devices.forEach(function(d) {
                    const iconClass = d.name.includes('Android') || d.name.includes('Celular') ? 'fa-mobile-screen' :
                                     d.name.includes('iOS') || d.name.includes('iPhone') || d.name.includes('iPad') ? 'fa-mobile-screen' :
                                     d.name.includes('TV') || d.name.includes('Smart') ? 'fa-tv' : 'fa-desktop';
                    const isCurrent = d.id === devices[0].id;
                    devicesHTML += '<div class="device-item">' +
                        '<div class="device-info">' +
                            '<div class="device-icon' + (isCurrent ? ' current' : '') + '"><i class="fas ' + iconClass + '"></i></div>' +
                            '<div>' +
                                '<div class="device-name">' + d.name + (isCurrent ? ' <span class="device-current-badge">Este dispositivo</span>' : '') + '</div>' +
                                '<div class="device-details">' + (d.os || '') + (d.browser ? ' - ' + d.browser : '') + '</div>' +
                            '</div>' +
                        '</div>' +
                        (isCurrent ? '' : '<button class="device-remove" onclick="removeDevice(\'' + d.id + '\')"><i class="fas fa-times"></i> Remover</button>') +
                    '</div>';
                });
            }
            devicesHTML += '<div class="devices-limit"><i class="fas fa-info-circle"></i> Limite de 2 dispositivos por conta. Remova um dispositivo para logar em outro.</div></div>';

            content.innerHTML = `
                <div class="account-card">
                    <div class="card-label">Dados Pessoais</div>
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Nome</div>
                            <div class="info-value">${user.name}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Email</div>
                            <div class="info-value">${user.email}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Membro desde</div>
                            <div class="info-value">${new Date(user.created_at).toLocaleDateString('pt-BR')}</div>
                        </div>
                    </div>
                </div>
                ${subHTML}
                ${devicesHTML}
                <button class="logout-btn" onclick="logout()">Sair da conta</button>
            `;
        }

        window.removeDevice = async function(deviceId) {
            if (!confirm('Remover este dispositivo?')) return;
            try {
                const r = await fetch(`${API}/auth/me`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ deviceId })
                });
                const d = await r.json();
                if (!r.ok) throw new Error(d.error);
                location.reload();
            } catch(e) { alert(e.message || 'Erro ao remover dispositivo'); }
        };

        window.logout = async function() {
            await fetch(`${API}/auth/logout`, { method: 'POST', credentials: 'include' });
            window.location.href = '/login.html';
        };
    })();
    </script>
</body>
